  <main class="container" id="app" aria-labelledby="appTitle">
    <nav class="topbar" aria-label="Stav aplikace">

      </div>

    <header class="hero">
      <p class="eyebrow">LOKÁLNÍ PSEUDO AI</p>
      <h1 id="appTitle" data-text="Jsem smažka?">Jsem smažka?</h1>
      <p class="subtitle">Lokální rozsudek. Nevědecký. Nemilosrdný.</p>
    </header>

    <section class="camera-section" id="scanner" aria-label="Kamera a sken">
      <div class="video-container" id="cameraStage">
        <video id="video" autoplay muted playsinline></video>
        <div class="preview-container hidden" id="previewContainer">
          <img id="preview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Náhled fotky pro sdílení výsledku">
        </div>
        <div class="camera-idle" id="cameraIdle" aria-hidden="true">
          <span class="idle-eye"></span>
          <span>Čekám na obličej</span>
        </div>
        <button id="switchCameraButton" class="stage-control hidden" type="button" aria-label="Přepnout kameru" title="Přepnout kameru">
          <svg class="ui-icon" aria-hidden="true"><use href="#icon-switch"></use></svg>
        </button>
        <div id="cameraError" class="error-message hidden" role="alert"></div>
        <div class="stage-vignette" aria-hidden="true"></div>
      </div>

      <p id="scanHint" class="scan-hint" aria-live="polite">Obličej doprostřed. Důstojnost stranou.</p>

      <div id="generalError" class="error-message hidden" role="alert"></div>

      <div class="button-group">
        <button id="captureButton" class="secondary-button hidden" type="button" aria-label="Vyfotit ručně">

          <span class="button-text">Vyfotit ručně</span>
        </button>
        <button id="uploadButton" class="secondary-button" type="button" aria-label="Nahrát fotku">
          <span class="button-icon" aria-hidden="true"><svg class="ui-icon"><use href="#icon-photo"></use></svg></span>
          <span class="button-text">Nahrát fotku</span>
        </button>
        <button id="retakeButton" class="secondary-button hidden" type="button" aria-label="Nový sken">
          <span class="button-icon" aria-hidden="true"><svg class="ui-icon"><use href="#icon-retry"></use></svg></span>
          <span class="button-text">Znovu</span>
        </button>
        <button id="analyzeButton" class="primary-button" type="button">
          <span class="button-icon" aria-hidden="true"><svg class="ui-icon"><use href="#icon-scan"></use></svg></span>
          <span class="button-text">Spustit sken</span>
        </button>
      </div>

      <input type="file" id="uploadInput" accept="image/*" class="hidden">

      <div id="loading" class="loading hidden" role="status" aria-live="polite">
        <p>Analyzuju obličej… Počítám zbytky lidskosti.</p>
      </div>

      <div class="privacy-strip" role="note" aria-label="Informace o soukromí">
        <svg class="ui-icon" aria-hidden="true"><use href="#icon-lock"></use></svg>
        <span>Fotka zůstává v zařízení · meme, ne diagnóza.</span>
      </div>
    </section>

    <canvas id="canvas" class="hidden" aria-hidden="true"></canvas>

    <footer>
      <button id="installButton" class="install-button hidden" type="button">Přidat jako aplikaci</button>
