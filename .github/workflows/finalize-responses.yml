name: Finalize response consolidation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-responses-final
          fetch-depth: 0

      - name: Consolidate response source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"      let data;\n"
              r"      try \{\n"
              r"        data = await fetchResponsePack\('responses\.json'\);\n"
              r"      \} catch \(primaryError\) \{\n"
              r"        console\.warn\('Hlavní balíček hlášek není dostupný:', primaryError\);\n"
              r"        data = await fetchResponsePack\('responses-extra\.js'\);\n"
              r"      \}\n"
          )
          app, count = pattern.subn("      const data = await fetchResponsePack('responses.json');\n", app, count=1)
          if count != 1:
              raise SystemExit('Nepodařilo se bezpečně upravit načítání responses.json')
          app_path.write_text(app, encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("  './responses-extra.js',\n", '')
          sw = re.sub(r"const CACHE_NAME = 'jsem-smazka-v\d+';", "const CACHE_NAME = 'jsem-smazka-v9';", sw, count=1)
          sw_path.write_text(sw, encoding='utf-8')

          extra = Path('responses-extra.js')
          if extra.exists():
              extra.unlink()

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '- Vygeneruje sdílitelný PNG obrázek s výsledkem.',
              '- Podle damage levelu lokálně a animovaně deformuje obličej (nafouknutí, stažení, vlnění a stékání).\n- Vygeneruje sdílitelný PNG obrázek s deformovaným obličejem a hláškou.'
          )
          readme = readme.replace(
              '- `styles.css` – responzivní dark/neon design.',
              '- `styles.css` – responzivní dark/neon design.\n- `face-warp.css` – vizuální efekty deformace, skenu a výsledku.'
          )
          readme = readme.replace(
              '- `face-scan.js` – animace skenu a zachycení aktuálního snímku.',
              '- `face-scan.js` – animace skenu a zachycení aktuálního snímku.\n- `face-warp.js` – lokální canvas deformace obličeje a příprava sdíleného PNG.'
          )
          readme = readme.replace('- `responses-extra.js` – záložní kopie hláškového balíčku.\n', '')
          readme_path.write_text(readme, encoding='utf-8')

          if 'responses-extra.js' in app_path.read_text(encoding='utf-8'):
              raise SystemExit('app.js stále odkazuje na responses-extra.js')
          if 'responses-extra.js' in sw_path.read_text(encoding='utf-8'):
              raise SystemExit('service-worker.js stále odkazuje na responses-extra.js')
          PY

      - name: Validate source
        run: |
          python3 -m json.tool responses.json >/dev/null
          node --check app.js
          node --check face-scan.js
          node --check face-warp.js
          node --check service-worker.js
          test ! -e responses-extra.js
          test "$(python3 - <<'PY'
          import json
          print(len(json.load(open('responses.json', encoding='utf-8'))))
          PY
          )" = "48"
          git diff --check

      - name: Commit clean final tree
        shell: bash
        run: |
          rm -f .github/workflows/finalize-responses.yml
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Consolidate response library"
          git push origin HEAD:agent/consolidate-responses-final
