name: Build verified v100 poster viewport fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-v71-result-owner-v100
          fetch-depth: 0
      - name: Scope legacy result animations away from poster
        run: python3 tools/apply-v100-poster-animation-scope.py
      - name: Install dependencies
        run: npm ci
      - name: Run Node contracts
        run: npm test
      - name: Run WebKit real iPhone checks
        run: npm run test:e2e
      - name: Prepare clean repository output
        run: |
          rm -rf node_modules test-results playwright-report
          rm tools/apply-v100-poster-animation-scope.py
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout HEAD -- .github/workflows/tests.yml
      - name: Commit verified v100 output
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "Fix poster viewport containing block v100 [skip ci]"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:fix/remove-v71-result-owner-v100
