name: Build verified v98 result refactor

on:
  push:
    branches: [fix/result-source-owned-v98]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/result-source-owned-v98
          fetch-depth: 0
      - name: Install migration runtime
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Apply source-owned result migration
        run: python3 tools/apply-result-v98.py
      - name: Align version contracts
        run: python3 tools/fix-v98-test-contracts.py
      - name: Repair generated WebKit fixture
        run: python3 tools/fix-v98-e2e.py
      - name: Constrain score to the grid
        run: python3 tools/fix-v98-layout.py
      - name: Install development dependencies
        run: npm install
      - name: Run Node contracts
        run: npm test
      - name: Run iPhone layout checks
        run: npm run test:e2e
      - name: Remove one-time migration helpers
        run: rm tools/apply-result-v98.py tools/fix-v98-test-contracts.py tools/fix-v98-e2e.py tools/fix-v98-layout.py
      - name: Commit verified production result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor mobile result ownership and add WebKit checks v98"
          git push origin HEAD:fix/result-source-owned-v98
