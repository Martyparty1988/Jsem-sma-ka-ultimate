name: Build verified v98 result refactor

on:
  push:
    branches: [fix/result-source-owned-v98]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/result-source-owned-v98
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source-owned result migration
        run: python3 tools/apply-result-v98.py
      - name: Align version contracts
        run: python3 tools/fix-v98-test-contracts.py
      - name: Install development dependencies
        run: npm install
      - name: Run Node contracts
        run: npm test
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run iPhone layout checks
        run: npm run test:e2e
      - name: Remove one-time migration helpers
        run: rm tools/apply-result-v98.py tools/fix-v98-test-contracts.py
      - name: Commit verified production result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor mobile result ownership and add WebKit checks v98"
          git push origin HEAD:fix/result-source-owned-v98
