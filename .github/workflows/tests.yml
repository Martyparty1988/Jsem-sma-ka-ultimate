name: Build verified v99 score authority

on:
  push:
    branches: [fix/result-score-authority-v99]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/result-score-authority-v99
          fetch-depth: 0
      - name: Install migration runtime
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Remove obsolete score ownership and bump v99
        run: python3 tools/apply-result-score-v99.py
      - name: Install dependencies
        run: npm ci
      - name: Run Node contracts
        run: npm test
      - name: Run WebKit score geometry checks
        run: npm run test:e2e
      - name: Prepare clean repository output
        run: |
          rm -rf node_modules test-results playwright-report
          rm tools/apply-result-score-v99.py
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" checkout HEAD -- .github/workflows/tests.yml
      - name: Commit verified v99 output
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "Remove legacy mobile score ownership v99 [skip ci]"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:fix/result-score-authority-v99
