name: One-time lifecycle prune v91

on:
  push:
    branches: [cleanup/lifecycle-v91]

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/lifecycle-v91
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prune obsolete lifecycle sections
        run: |
          if [ ! -f scripts/prune-lifecycle-v91.mjs ]; then
            echo "Prune script already removed; nothing to do."
            exit 0
          fi
          node scripts/prune-lifecycle-v91.mjs

      - name: Run full regression suite
        run: node --test tests/*.test.mjs

      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lifecycle-runtime.js result-poster.css index.html service-worker.js tests
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Prune obsolete lifecycle result owners"
          git push origin HEAD:cleanup/lifecycle-v91
