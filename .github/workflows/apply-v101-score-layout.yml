name: Apply verified v101 score layout

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: fix/score-below-photo-v101
          fetch-depth: 0
      - name: Apply v101 score below photo layout
        run: |
          python3 tools/apply-v101-score-below-photo.py
          python3 tools/fix-v101-update-test.py
      - name: Install dependencies
        run: npm ci
      - name: Run Node contracts
        run: npm test
      - name: Run WebKit iPhone checks
        run: npm run test:e2e
      - name: Prepare clean output
        run: |
          rm -rf node_modules test-results playwright-report
          rm tools/apply-v101-score-below-photo.py
          rm tools/fix-v101-update-test.py
          rm .github/workflows/apply-v101-score-layout.yml
      - name: Commit verified v101 output
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "Move score below result photo v101 [skip ci]"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:fix/score-below-photo-v101
