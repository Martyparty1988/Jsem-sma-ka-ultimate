name: Export validated workspace

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Apply approved source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          app_path = root / 'app.js'
          app = app_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"      let data;\n"
              r"      try \{\n"
              r"        data = await fetchResponsePack\('responses\.json'\);\n"
              r"      \} catch \(primaryError\) \{\n"
              r"        console\.warn\('Hlavní balíček hlášek není dostupný:', primaryError\);\n"
              r"        data = await fetchResponsePack\('responses-extra\.js'\);\n"
              r"      \}\n"
          )
          app, count = pattern.subn("      const data = await fetchResponsePack('responses.json');\n", app, count=1)
          if count != 1:
              raise SystemExit('Nepodařilo se upravit načítání responses.json')
          app_path.write_text(app, encoding='utf-8')

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          if 'face-warp.css' not in index:
              index = index.replace(
                  '  <link rel="stylesheet" href="styles.css">',
                  '  <link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="face-warp.css">'
              )
          if 'src="face-warp.js"' not in index:
              index = index.replace(
                  '  <script defer src="app.js"></script>\n  <script defer src="face-scan.js"></script>',
                  '  <script defer src="app.js"></script>\n  <script defer src="face-warp.js"></script>\n  <script defer src="face-scan.js"></script>'
              )
          index_path.write_text(index, encoding='utf-8')

          sw_path = root / 'service-worker.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_NAME = 'jsem-smazka-v\d+';", "const CACHE_NAME = 'jsem-smazka-v7';", sw, count=1)
          sw = sw.replace("  './responses-extra.js',\n", '')
          if "  './face-warp.css'," not in sw:
              sw = sw.replace("  './styles.css',\n", "  './styles.css',\n  './face-warp.css',\n")
          if "  './face-warp.js'," not in sw:
              sw = sw.replace("  './app.js',\n", "  './app.js',\n  './face-warp.js',\n")
          sw_path.write_text(sw, encoding='utf-8')

          extra = root / 'responses-extra.js'
          if extra.exists():
              extra.unlink()

          css = r'''/* Face warp integration and scan/result polish. */
.warp-result-canvas {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  background: #030816;
}

.result.warp-progress .result-visual {
  box-shadow: 0 22px 56px rgba(2, 6, 23, 0.62), 0 0 42px color-mix(in srgb, var(--effect-accent) 28%, transparent), inset 0 1px rgba(255, 255, 255, 0.14);
}

.result.warp-progress .effect-noise { opacity: calc(var(--effect-noise-opacity) + 0.08); }

#scanOverlay::before,
#scanOverlay::after {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
}

#scanOverlay:has(#scanLine.active)::before {
  opacity: 1;
  background: radial-gradient(circle at 50% 42%, rgba(34, 211, 238, 0.16), transparent 34%), repeating-linear-gradient(180deg, transparent 0 15px, rgba(103, 232, 249, 0.045) 16px 17px);
  animation: scanFieldPulse 1.15s ease-in-out infinite alternate;
}

#scanOverlay:has(#scanLine.active)::after {
  opacity: 1;
  border: 1px solid rgba(103, 232, 249, 0.26);
  border-radius: inherit;
  box-shadow: inset 0 0 54px rgba(34, 211, 238, 0.12);
  animation: scanFrameCharge 0.9s ease-in-out infinite alternate;
}

#scanLine.active {
  height: 3px;
  background: linear-gradient(90deg, transparent 1%, #22d3ee 24%, #fff 50%, #34d399 76%, transparent 99%);
  box-shadow: 0 0 18px rgba(255, 255, 255, 0.8), 0 0 38px rgba(34, 211, 238, 0.95), 0 0 72px rgba(52, 211, 153, 0.36);
}

.video-container:has(#scanLine.active) { animation: scanStagePulse 0.85s ease-in-out infinite alternate; }

.result:not(.hidden) .result-content > * { animation: resultItemReveal 0.48s cubic-bezier(0.16, 1, 0.3, 1) both; }
.result:not(.hidden) .result-content > :nth-child(2) { animation-delay: 0.07s; }
.result:not(.hidden) .result-content > :nth-child(3) { animation-delay: 0.13s; }
.result:not(.hidden) .result-content > :nth-child(4) { animation-delay: 0.19s; }

.result-close,
.stage-control { min-width: 44px; min-height: 44px; }

.primary-button,
.secondary-button,
.share-button,
.new-scan-button,
.install-button { min-height: 48px; }

.result {
  padding-right: max(20px, env(safe-area-inset-right));
  padding-left: max(20px, env(safe-area-inset-left));
}

@keyframes scanFieldPulse {
  from { filter: saturate(1); transform: scale(1); }
  to { filter: saturate(1.45); transform: scale(1.012); }
}
@keyframes scanFrameCharge { from { opacity: 0.42; } to { opacity: 0.92; } }
@keyframes scanStagePulse { from { border-color: rgba(148, 210, 228, 0.25); } to { border-color: rgba(103, 232, 249, 0.62); } }
@keyframes resultItemReveal { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

@media (max-width: 370px) {
  .result { padding-right: max(14px, env(safe-area-inset-right)); padding-left: max(14px, env(safe-area-inset-left)); }
  .result-visual { width: clamp(116px, 18svh, 146px); }
  .result h2 { padding-inline: 4px; font-size: clamp(1.65rem, 8vw, 2.1rem); }
}

@media (prefers-reduced-motion: reduce) {
  #scanOverlay:has(#scanLine.active)::before,
  #scanOverlay:has(#scanLine.active)::after,
  .video-container:has(#scanLine.active),
  .result:not(.hidden) .result-content > * { animation: none !important; }
}
'''
          (root / 'face-warp.css').write_text(css, encoding='utf-8')

          if 'responses-extra.js' in app_path.read_text(encoding='utf-8'):
              raise SystemExit('app.js stále odkazuje na responses-extra.js')
          if 'responses-extra.js' in sw_path.read_text(encoding='utf-8'):
              raise SystemExit('service-worker.js stále odkazuje na responses-extra.js')
          PY

      - name: Validate syntax
        run: |
          python3 -m json.tool responses.json >/dev/null
          node --check app.js
          node --check face-scan.js
          node --check face-warp.js
          node --check service-worker.js
          git diff --check

      - name: Remove temporary workflow from exported tree
        run: rm -rf .github/workflows/agent-finalize.yml

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: smazka-final-workspace
          path: |
            .
            !.git/**
          retention-days: 3
